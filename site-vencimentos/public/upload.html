<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adicionar funcionários — Vencimentos de Experiência</title>
<style>
  body {
    font-family: -apple-system, Arial, sans-serif; margin: 0; background:#f7f7f8; color:#222;
  }
  .container { padding: 24px; display:flex; flex-direction:column; align-items:flex-start; }
  .topbar {
    background:#000; color:#fff; display:flex; align-items:center;
    justify-content:space-between; padding: 14px 24px; flex-wrap: wrap; gap: 12px;
  }
  .topbar-title { font-size: 24px; font-weight:600; }
  .topbar-sub { font-size: 15px; color:#bbb; margin-top: 4px; }
  .topbar-logo-badge {
    background:#fff; border-radius: 8px; padding: 8px 18px; display:flex; align-items:center;
  }
  .topbar-logo { height: 42px; width:auto; display:block; }
  .tabs { display:flex; gap:4px; margin-bottom: 20px; border-bottom: 2px solid #e2e2e2; max-width: 420px; }
  .tab {
    padding: 12px 20px; font-size: 16px; text-decoration:none; color:#666;
    border-bottom: 2px solid transparent; margin-bottom: -2px;
  }
  .tab:hover { color:#222; }
  .tab.active { color:#222; font-weight:600; border-bottom-color:#2c2c2c; }
  .card {
    background:#fff; border-radius: 10px; box-shadow: 0 1px 6px rgba(0,0,0,.12);
    padding: 28px; width: 100%; max-width: 460px; box-sizing: border-box;
  }
  h1 { font-size: 22px; margin: 0 0 8px; }
  .sub { font-size: 15px; color:#666; margin-bottom: 22px; }
  label { display:block; font-size: 15px; margin-bottom: 8px; color:#333; }
  input[type=password], input[type=file] {
    width: 100%; box-sizing: border-box; padding: 11px 12px; margin-bottom: 18px;
    border: 1px solid #ccc; border-radius: 6px; font-size: 16px;
  }
  button {
    width: 100%; padding: 12px; background:#2c2c2c; color:#fff; border:none;
    border-radius: 6px; font-size: 16px; cursor:pointer;
  }
  button:hover { background:#3d3d3d; }
  button:disabled { opacity:.6; cursor:default; }
  #msg { margin-top: 16px; font-size: 15px; white-space: pre-line; }
  #msg.ok { color:#1a7a1a; }
  #msg.err { color:#b3261e; }
</style>
</head>
<body>
  <div class="topbar">
    <div>
      <div class="topbar-title">Vencimentos de Experiência</div>
      <div class="topbar-sub">Contrato de experiência — 30/60 dias</div>
    </div>
    <div class="topbar-logo-badge">
      <img src="/logo.png" alt="Mavaular Móveis" class="topbar-logo">
    </div>
    <div></div>
  </div>
  <div class="container">
  <div class="tabs">
    <a class="tab" href="/">Visualizar</a>
    <a class="tab active" href="/upload.html">Adicionar dados</a>
  </div>
  <div class="card">
    <h1>Adicionar novos funcionários</h1>
    <div class="sub">Envie um arquivo Word, Excel ou PDF com os novos funcionários. Duplicados (já cadastrados) são ignorados automaticamente.</div>
    <form id="form">
      <label for="password">Senha</label>
      <input type="password" id="password" name="password" required autocomplete="current-password">

      <label for="file">Arquivo (.xlsx, .xls, .csv, .docx ou .pdf)</label>
      <input type="file" id="file" name="file" accept=".xlsx,.xls,.csv,.docx,.pdf" required>

      <button type="submit" id="submitBtn">Enviar e importar</button>
    </form>
    <div id="msg"></div>
  </div>
  </div>

<script>
  const form = document.getElementById('form');
  const msg = document.getElementById('msg');
  const btn = document.getElementById('submitBtn');

  form.addEventListener('submit', async function(e) {
    e.preventDefault();
    msg.className = '';
    msg.textContent = '';
    btn.disabled = true;
    btn.textContent = 'Enviando...';

    const fd = new FormData(form);
    try {
      const res = await fetch('/api/upload', { method: 'POST', body: fd });
      const data = await res.json();
      if (!res.ok) {
        msg.className = 'err';
        msg.textContent = data.error || 'Erro ao processar o arquivo.';
      } else {
        let text = 'Arquivo "' + data.file + '" processado.\n';
        text += data.adicionados + ' novo(s) adicionado(s), ' + data.duplicados + ' já existiam (ignorados).';
        if (data.nomesAdicionados && data.nomesAdicionados.length) {
          text += '\n\nNovos: ' + data.nomesAdicionados.join(', ');
        }
        msg.className = 'ok';
        msg.textContent = text;
        form.reset();
      }
    } catch (err) {
      msg.className = 'err';
      msg.textContent = 'Falha de conexão: ' + err.message;
    } finally {
      btn.disabled = false;
      btn.textContent = 'Enviar e importar';
    }
  });
</script>
</body>
</html>
